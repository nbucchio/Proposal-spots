<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f1eb;
    --bg2: #EDEAE2;
    --bg3: #E8E4DB;
    --white: #FDFCFA;
    --ink: #1a1612;
    --ink2: #2E2C2A;
    --mid: #6b6560;
    --muted: #9E9890;
    --hairline: rgba(26,22,18,0.1);
    --divider: #E4E0D8;
    --accent: #a55a4a;

    --topbar-h: 132px;   /* filter bar + continent pills, desktop */
  }

  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  #nav-root { position: relative; z-index: 500; }

  /* ============================================================
     TOP BAR — search (destination / vibe / budget) + continents
     ============================================================ */
  /* nav.js renders a FIXED pill nav at top:20px, height 52px, so the top bar
     has to reserve room for it or the nav floats over the search field and
     swallows its clicks. --topbar-h is re-measured at runtime. */
  .map-topbar {
    position: sticky;
    top: 0;
    z-index: 400;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline);
    padding-top: 84px;
  }

  .map-search-row {
    display: flex;
    justify-content: center;
    padding: 16px 24px 12px;
  }

  /* Compact mobile search pill — desktop never shows it */
  .msb-compact {
    display: none;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 520px;
    padding: 9px 16px 9px 20px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 100px;
    cursor: pointer;
    text-align: left;
    font-family: 'Jost', sans-serif;
  }
  .msb-compact-text { flex: 1 1 auto; min-width: 0; }
  .msb-compact-main {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msb-compact-sub {
    display: block;
    font-size: 11px;
    font-weight: 300;
    color: var(--ink);
    opacity: 0.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .msb-compact-icon {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    color: var(--ink);
  }

  .msb-wrap {
    display: flex;
    align-items: stretch;
    width: 100%;
    max-width: 780px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 100px;
    position: relative;
  }

  .msb-segment {
    flex: 1 1 0;
    position: relative;
    padding: 10px 22px;
    cursor: pointer;
    border-radius: 100px;
    transition: background 0.18s ease;
    min-width: 0;
  }
  .msb-segment:hover { background: var(--bg2); }
  .msb-segment.open  { background: var(--bg2); }

  .msb-label {
    display: block;
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.55;
    margin-bottom: 3px;
  }
  .msb-value {
    display: block;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msb-value.placeholder { opacity: 0.45; }

  /* Destination is a real text input so it can behave like Airbnb's typeahead */
  #msb-dest-input {
    display: block;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink);
    padding: 0;
  }
  #msb-dest-input::placeholder { color: var(--ink); opacity: 0.45; }

  .msb-div {
    width: 1px;
    background: var(--hairline);
    margin: 12px 0;
    flex: 0 0 1px;
  }

  .msb-btn {
    flex: 0 0 auto;
    margin: 6px 6px 6px 0;
    padding: 0 22px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity 0.18s ease;
    white-space: nowrap;
  }
  .msb-btn:hover { opacity: 0.6; }

  /* Dropdowns */
  .msb-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    min-width: 260px;
    max-height: 340px;
    overflow-y: auto;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 8px 0;
    z-index: 60;
  }
  .msb-segment.open .msb-dropdown { display: block; }
  #msb-dest-dd { min-width: 300px; }

  .msb-dd-item {
    display: block;
    padding: 9px 18px;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.14s ease;
  }
  .msb-dd-item:hover,
  .msb-dd-item.active { background: var(--bg2); }
  .msb-dd-item.selected { color: var(--accent); }

  .msb-dd-group {
    padding: 10px 18px 4px;
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.4;
  }
  .msb-dd-sub {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.4;
    margin-top: 2px;
  }
  .msb-dd-empty {
    padding: 14px 18px;
    font-size: 12px;
    color: var(--ink);
    opacity: 0.5;
  }

  /* Continent pills */
  .map-pills-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 24px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    justify-content: center;
  }
  .map-pills-row::-webkit-scrollbar { display: none; }

  .map-pill {
    flex: 0 0 auto;
    padding: 7px 18px;
    border: 1px solid var(--hairline);
    border-radius: 100px;
    background: transparent;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.18s ease, border-color 0.18s ease;
  }
  .map-pill:hover { opacity: 0.6; }
  .map-pill.active {
    border-color: var(--ink);
    background: var(--bg2);
    color: var(--ink);
  }

  /* ============================================================
     SPLIT LAYOUT
     ============================================================ */
  .map-shell {
    display: flex;
    align-items: stretch;
    height: calc(100vh - var(--topbar-h));
    min-height: 420px;
  }

  .map-results {
    flex: 1 1 58%;
    min-width: 0;
    overflow-y: auto;
    padding: 20px 24px 60px;
  }

  .map-results-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .map-results-count {
    font-family: 'Cormorant', serif;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .map-results-note {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: var(--ink);
    opacity: 0.5;
  }

  .spots-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px 24px;
  }
  @media (min-width: 1500px) {
    .spots-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .map-results-empty {
    padding: 60px 20px;
    text-align: center;
  }
  .map-results-empty h3 {
    font-family: 'Cormorant', serif;
    font-size: 26px;
    font-weight: 300;
    margin-bottom: 10px;
  }
  .map-results-empty p {
    font-size: 13px;
    opacity: 0.55;
    margin-bottom: 20px;
  }

  .map-reset-btn {
    padding: 9px 22px;
    border: 1px solid var(--ink);
    background: transparent;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink);
    cursor: pointer;
    transition: opacity 0.18s ease;
  }
  .map-reset-btn:hover { opacity: 0.6; }

  .map-pane {
    flex: 1 1 42%;
    position: relative;
    min-width: 0;
    background: var(--bg3);
  }
  #map { position: absolute; inset: 0; }

  /* Search-as-you-move toggle, floating on the map */
  .map-move-toggle {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .map-move-toggle input { accent-color: var(--accent); cursor: pointer; }

  /* ============================================================
     MARKERS — price pills, brand styled
     ============================================================ */
  /* Mapbox writes its own transform onto the marker element to position it,
     so the pin itself must be an inner node — otherwise our hover scale and
     spiderfy offsets overwrite the positioning and the pin jumps. */
  .pin-wrap { will-change: transform; }

  .pin {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 11px;
    background: var(--white);
    border: 1px solid rgba(26,22,18,0.22);
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink);
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    will-change: transform;
  }
  .pin:hover,
  .pin.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--white);
    z-index: 3;
  }

  .pin-cluster {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    background: var(--white);
    border: 1px solid rgba(26,22,18,0.22);
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
  }
  .pin-cluster:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--white);
  }

  /* Card popup shown when a pin is clicked (desktop) */
  .map-popup .mapboxgl-popup-content {
    padding: 0;
    background: transparent;
    border-radius: 12px;
    box-shadow: none;
  }
  .map-popup .mapboxgl-popup-tip { display: none; }
  .map-popup-card {
    width: 230px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .map-popup-img {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--bg3) center/cover no-repeat;
    display: block;
  }
  .map-popup-body { padding: 10px 12px 12px; }
  .map-popup-name {
    font-family: 'Cormorant', serif;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .map-popup-loc {
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgb(150,145,140);
    margin-bottom: 6px;
  }
  .map-popup-meta {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    color: rgb(150,145,140);
  }
  .mapboxgl-popup-close-button {
    font-size: 20px;
    color: var(--ink);
    padding: 2px 8px;
    right: 2px;
    top: 2px;
  }

  /* ============================================================
     SPOT CARDS — copied from index.html so the panel matches /search
     ============================================================ */
  .spot-card {
    display: block;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    cursor: pointer;
    background: transparent;
  }
  .spot-card-img {
    aspect-ratio: 4/5;
    background: var(--bg3);
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    container-type: inline-size;
  }
  .sc-strip { position: absolute; top: 0; left: 0; height: 100%; display: flex; }
  .sc-frame { flex: 0 0 100cqw; height: 100%; position: relative; overflow: hidden; }
  .img-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .spot-card-img::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(10,8,5,0.82) 100%);
    pointer-events: none;
  }
  .spot-card-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(165,90,74,0.82);
    backdrop-filter: blur(8px);
    color: var(--white);
    font-family: 'Jost', sans-serif;
    font-size: 8px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 4px 11px;
    border-radius: 100px;
    z-index: 2;
  }
  .spot-card-body {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 18px;
    height: auto;
    padding: 4px 12px 14px;
    border-top: none;
    background: transparent;
  }
  .spot-card-name {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 400;
    color: #1a1612;
    text-align: center;
    line-height: 1.2;
    padding: 18px 12px 3px;
    margin: 0;
  }
  .spot-card-strip-item {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; flex: 0 0 auto;
  }
  .spot-card-strip-text {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: rgb(150, 145, 140);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spot-card-strip-divider {
    width: 1px; height: 13px;
    background: rgba(26,22,18,0.18);
    flex-shrink: 0;
  }
  .spot-card-location {
    display: block;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgb(150, 145, 140);
    text-align: center;
    padding: 0 12px 0;
    background: transparent;
  }
  .spot-card-location::after {
    content: '';
    display: block;
    height: 1px;
    background: rgba(26,22,18,0.12);
    margin: 14px auto 0;
    max-width: 220px;
  }
  .sc-arrow {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    background: rgba(253,252,250,0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: none; border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; line-height: 1;
    color: rgba(28,28,28,0.8);
    z-index: 4; opacity: 0;
    transition: opacity 0.18s ease;
    pointer-events: none; padding: 0;
  }
  .spot-card:hover .sc-arrow { opacity: 1; pointer-events: auto; }
  .sc-arrow:hover { background: rgba(253,252,250,0.98); }
  .sc-arrow-prev { left: 8px; }
  .sc-arrow-next { right: 8px; }
  .sc-dots {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 4; pointer-events: none;
  }
  .sc-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(253,252,250,0.45);
    transition: background 0.2s;
  }
  .sc-dot.active { background: rgba(253,252,250,0.92); }

  /* Card <-> pin hover link */
  .spot-card.is-hovered .spot-card-img { outline: 1px solid var(--accent); outline-offset: 2px; }

  /* ============================================================
     MOBILE — list by default, fullscreen map on demand (Airbnb)
     ============================================================ */
  .map-mobile-toggle {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 450;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.18s ease;
  }
  .map-mobile-toggle:hover { opacity: 0.75; }

  /* Collapsed bottom sheet over the map (Airbnb shows the result count here) */
  /* Desktop: the sheet is not a box at all — the list sits in the grid
     exactly as before. Everything that makes it a sheet is mobile-only. */
  .map-sheet { display: contents; }
  .map-sheet-grab { display: none; }
  .map-sheet-handle {
    width: 40px; height: 4px;
    border-radius: 100px;
    background: rgba(26,22,18,0.20);
  }
  .map-sheet-label {
    font-family: 'Cormorant', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--ink);
  }

  /* ---------- Mobile filter sheet ---------- */
  .fsheet {
    display: none;
    position: fixed;
    inset: 0;
    /* nav.js pins #navbar at z-index 10000; the sheet has to clear it or the
       nav pill sits over this header and swallows taps meant for the X. */
    z-index: 10050;
    background: var(--bg);
    flex-direction: column;
  }
  body.fsheet-open .fsheet { display: flex; }
  body.fsheet-open { overflow: hidden; }
  /* Belt and braces: the nav is also hidden outright while the sheet is up. */
  body.fsheet-open #navbar,
  body.fsheet-open .nav-backdrop,
  body.fsheet-open .map-mobile-toggle { display: none !important; }

  .fsheet.is-dragging { transition: none; }
  .fsheet.is-closing { transition: transform 0.2s ease-in; }

  .fsheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    flex: 0 0 auto;
    touch-action: none;    /* the header owns vertical gestures */
  }
  .fsheet-grip {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 4px;
    border-radius: 100px;
    background: rgba(26,22,18,0.18);
  }
  .fsheet-title {
    font-family: 'Cormorant', serif;
    font-size: 19px;
    color: var(--ink);
  }
  .fsheet-close {
    position: relative;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
  }
  /* Keeps the 32px circle but gives it a 48px target, over Apple's 44 minimum */
  .fsheet-close::after {
    content: '';
    position: absolute;
    inset: -8px;
  }

  .fsheet-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 12px 16px;

    flex-direction: column;
    gap: 10px;
  }

  .fpanel {

    border: 1px solid var(--hairline);

  }
  .fpanel-collapsed {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 20px;
    cursor: pointer;
    text-align: left;
  }
  .fp-label { font-size: 12px; color: var(--ink); opacity: 0.55; }
  .fp-value {
    font-size: 13px;
    color: var(--ink);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fpanel-open { padding: 18px 18px 16px; }
  .fp-title {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 400;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .fp-search {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--ink);
  }
  .fp-search input {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  .fp-list { margin-top: 6px; max-height: 320px; overflow-y: auto; }
  .fp-opts { display: flex; flex-direction: column; }

  .fp-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 12px 4px;
    border: none;

  .fsheet-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));

    background: var(--bg);
  }
  .fsheet-reset {
    border: none;
    background: transparent;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
    padding: 8px 4px;
  }
  .fsheet-search {
    border: none;
    background: var(--accent);
    color: var(--white);
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 13px 30px;
    border-radius: 100px;
    cursor: pointer;
  }

  /* Horizontal card tray over the map on mobile */
  .map-tray {
    display: none;
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 8;
    padding: 12px 16px 20px;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .map-tray::-webkit-scrollbar { display: none; }
  .map-tray .spot-card {
    flex: 0 0 74vw;
    max-width: 300px;
    scroll-snap-align: center;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
  }
  .map-tray .spot-card-img { aspect-ratio: 16/10; border-radius: 0; }
  .map-tray .spot-card-name { font-size: 18px; padding: 10px 10px 2px; }
  .map-tray .spot-card-body { padding: 2px 10px 12px; gap: 12px; }

  @media (max-width: 1024px) {
    :root { --topbar-h: 124px; }

    .map-shell { display: block; height: auto; }

    /* The grab bar already states the count; a second copy inside the list
       just repeats it. */
    .map-results-head { display: none !important; }

    .map-results {
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 18px 120px;
    }
    .spots-grid { grid-template-columns: 1fr; gap: 22px; }

    .map-pane {
      position: fixed;
      inset: var(--topbar-h) 0 0 0;
      z-index: 300;
      display: block;
    }

    /* The sheet's position IS the mode: peeked shows the map, lifted shows
       the list. Both stay mounted, so dragging between them is instant and
       the map never has to re-initialise. */
    .map-sheet {
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0; right: 0;
      top: var(--topbar-h);
      height: calc(100dvh - var(--topbar-h));
      z-index: 320;
      background: var(--bg);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -10px 34px rgba(26,22,18,0.16);
      transform: translateY(var(--sheet-y, 0px));
    }
    .map-sheet.is-snapping { transition: transform 0.34s cubic-bezier(0.32,0.72,0,1); }

    .map-sheet-grab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 10px 20px 12px;
      flex: 0 0 auto;
      cursor: grab;
      /* Let the handle own vertical gestures so the drag never fights scroll */
      touch-action: none;
    }

    /* Tapping a pin swaps the sheet for that spot's card */
    body.map-tray-open .map-sheet { opacity: 0; pointer-events: none; }
    body.map-tray-open .map-tray { display: flex; }

    .map-mobile-toggle { display: flex; }
    /* The sheet already offers the way back to the list */
    body.map-mode-map .map-mobile-toggle { bottom: 96px; }

    .map-search-row { padding: 12px 14px 10px; }

    /* The compact pill is the only search affordance on mobile; tapping it

    .msb-wrap { display: none; }
    .msb-segment { flex: 1 1 100%; padding: 9px 16px; border-radius: 16px; }
    .msb-div { display: none; }

    .msb-dropdown { position: static; width: 100%; min-width: 0; border: none; border-top: 1px solid var(--hairline); border-radius: 0; max-height: 240px; }
    #msb-dest-dd { min-width: 0; }

    .map-pills-row { justify-content: flex-start; padding: 0 14px 12px; }
    .map-move-toggle { top: 10px; font-size: 10px; padding: 8px 13px; }
    .spot-card-img { aspect-ratio: 7/6; }
    .sc-arrow { display: none !important; }
  }

  /* Loading state */
  .map-loading {
    padding: 60px 20px;
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    color: var(--ink);
    opacity: 0.5;
  }

  /* Shown only if the Mapbox token has not been set yet */
  .map-token-notice {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 30px;
    text-align: center;
    background: var(--bg3);

    font-size: 13px;
    font-weight: 300;

  }
  .map-token-notice strong { font-weight: 400; }
  .map-token-notice code {
    font-size: 12px;
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
