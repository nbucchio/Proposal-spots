<script>
/* ==============================================================
   Proposal Spots — Map page
   Split map + list search, modelled on Airbnb, in our own system.
   ============================================================== */

/* --------------------------------------------------------------
   1. Mapbox token
   Public (pk.) tokens are safe in client code — restrict it to
   proposalspots.com in the Mapbox dashboard under URL restrictions.
   -------------------------------------------------------------- */
var MAPBOX_TOKEN = 'pk.eyJ1IjoicHJvcG9zYWxzcG90cyIsImEiOiJjbXQxcjNmNTEwanByMnlvaGxscGJjYWtxIn0.Ge3dzMLKklBnAyHR3O1odw';

/* --------------------------------------------------------------
   2. Country -> continent
   Derived here rather than from Destination Heroes, which does not
   yet cover every country we have listings in (Croatia, Morocco,
   Spain are missing there).
   -------------------------------------------------------------- */
var COUNTRY_CONTINENT = {
  'Portugal': 'Europe',
  'Italy': 'Europe',
  'Switzerland': 'Europe',
  'Greece': 'Europe',
  'France': 'Europe',
  'Croatia': 'Europe',
  'Spain': 'Europe',
  'United Kingdom': 'Europe',
  'England': 'Europe',
  'Mexico': 'North America',
  'United States': 'North America',
  'USA': 'North America',
  'Canada': 'North America',
  'Hawaii': 'North America',
  'Costa Rica': 'Central America',
  'Nicaragua': 'Central America',
  'Panama': 'Central America',
  'Belize': 'Central America',
  'Guatemala': 'Central America',
  'Patagonia (Chile/Argentina)': 'South America',
  'Chile': 'South America',
  'Argentina': 'South America',
  'Brazil': 'South America',
  'Colombia': 'South America',
  'Peru': 'South America',
  'Indonesia': 'Asia',
  'Thailand': 'Asia',
  'Japan': 'Asia',
  'Maldives': 'Asia',
  'Sri Lanka': 'Asia',
  'Vietnam': 'Asia',
  'Philippines': 'Asia',
  'Morocco': 'Africa',
  'South Africa': 'Africa',
  'Tanzania': 'Africa',
  'Kenya': 'Africa',
  'Egypt': 'Africa',
  'Mauritius': 'Africa',
  'Seychelles': 'Africa',
  'Australia': 'Oceania',
  'New Zealand': 'Oceania',
  'Fiji': 'Oceania',
  'French Polynesia': 'Oceania'
};

/* Display order for the pills */
var CONTINENT_ORDER = ['Europe', 'Asia', 'North America', 'Central America', 'South America', 'Africa', 'Oceania'];

function continentOf(s) {
  return COUNTRY_CONTINENT[(s.Country || '').trim()] || '';
}

/* Base list matches the homepage search bar. The live list is rebuilt from
   the actual spots at load time, because Airtable carries vibes the homepage
   list never had (Vineyard, Waterfall, Castle ...). */
var VIBES = ['Beach','Mountain','Cliff','Lake','Volcano','Ocean','City','Jungle','Luxury','Hiking','Rural','Boat','Desert'];

function buildVibeList() {
  var seen = {};
  allSpots.forEach(function (s) {
    var pool = [];
    if (Array.isArray(s.Vibe)) pool = pool.concat(s.Vibe); else if (s.Vibe) pool.push(s.Vibe);
    pool = pool.concat(s['Vibe Secondary All'] || []);
    pool.forEach(function (v) {
      var name = String(v || '').trim();
      if (name) seen[name] = true;
    });
  });
  var found = Object.keys(seen).sort();
  return found.length ? found : VIBES;
}
var BUDGETS = [
  { slug: 'affordable', value: 'Affordable', label: '$ Affordable' },
  { slug: 'premium',    value: 'Premium',    label: '$$ Premium' },
  { slug: 'luxury',     value: 'Luxury',     label: '$$$ Luxury' }
];

/* --------------------------------------------------------------
   3. State
   -------------------------------------------------------------- */
var allSpots = [];
var state = {
  destination: '',
  vibe: '',
  budget: '',
  continent: '',
  searchAsMove: true
};

var map = null;
var markers = [];          /* { spot, marker, el } for every mappable spot */
var clusterMarkers = [];   /* pooled cluster markers, rebuilt on each pass */
var activePopup = null;
var mapReady = false;
var pendingFit = true;     /* fit to results the first time only */

/* --------------------------------------------------------------
   4. Data — mirrors fetchFromAirtable() in index.html so cards
   render identically, plus Latitude / Longitude for the map.
   -------------------------------------------------------------- */
async function fetchSpots() {
  try {
    var response = await fetch('/api/spots');
    if (!response.ok) { console.error('API error:', response.status); return []; }
    var data = await response.json();
    if (!data.records || !data.records.length) return [];

    return data.records.map(function (r) {
      var f = r.fields;

      var rawPrivacy = f['Privacy'] || '';
      var privacy = rawPrivacy.indexOf('Private') > -1 ? 'Private'
        : rawPrivacy.indexOf('Light') > -1 ? 'Light Crowd'
        : rawPrivacy.indexOf('Moderate') > -1 ? 'Moderate Crowd'
        : rawPrivacy.indexOf('Everyone') > -1 ? 'Everyone Will See'
        : rawPrivacy;

      var rawBudget = f['Budget'] || '';
      var budget = rawBudget === 'Moderate' ? 'Premium'
        : rawBudget === 'Expensive' ? 'Luxury'
        : rawBudget;

      var vibeSecondaryArr = Array.isArray(f['Vibe Secondary'])
        ? f['Vibe Secondary'].filter(Boolean)
        : (f['Vibe Secondary'] ? [f['Vibe Secondary']] : []);

      var otherVibeArr = Array.isArray(f['Other Vibe'])
        ? f['Other Vibe']
        : (f['Other Vibe'] ? [f['Other Vibe']] : []);

      var lat = f['Latitude'];
      var lng = f['Longitude'];
      /* Formula fields return {error} objects when they cannot resolve */
      if (lat && typeof lat === 'object') lat = null;
      if (lng && typeof lng === 'object') lng = null;

      return {
        id: r.id,
        Name: f['Spot Name'] || f['Name'] || '',
        Slug: f['Slug'] || '',
        Country: f['Country'] || '',
        Region: f['Region / Town'] || f['Region'] || '',
        Vibe: f['Vibe'] || '',
        'Vibe Secondary': vibeSecondaryArr[0] || '',
        'Vibe Secondary All': vibeSecondaryArr,
        'Other Vibe': otherVibeArr,
        Privacy: privacy,
        Budget: budget,
        'Cover Photo': (f['Cover Photo'] && f['Cover Photo'][0] && f['Cover Photo'][0].url) || null,
        'Spot Card Photo': (f['Spot Card Photo'] && f['Spot Card Photo'][0] && f['Spot Card Photo'][0].url) || null,
        'Card Position': f['Card Position'] || 'center center',
        'Gallery Photos': (f['Gallery Photos'] || []),
        'Google Maps Link': f['Google Maps Link'] || '',
        Latitude: (lat === '' || lat === undefined) ? null : lat,
        Longitude: (lng === '' || lng === undefined) ? null : lng,
        badge: f['Badge'] || null,
        coverGradient: f['Cover Gradient'] || 'linear-gradient(160deg,#28342c,#1e2835)',
        'Price Moment': f['Price Moment'] || null,
        'Price Currency': f['Price Currency'] || null,
        editorsPick: !!(f['Editors Pick']),
        packages: Array.isArray(r.packages) ? r.packages : []
      };
    });
  } catch (err) {
    console.error('API fetch failed:', err);
    return [];
  }
}

function hasCoords(s) {
  return typeof s.Latitude === 'number' && typeof s.Longitude === 'number'
    && !isNaN(s.Latitude) && !isNaN(s.Longitude);
}

/* --------------------------------------------------------------
   5. Pricing helpers — same rules as index.html
   -------------------------------------------------------------- */
var FX_TO_USD = {
  USD: 1, EUR: 1.08, GBP: 1.27, IDR: 0.000063, MXN: 0.055, CHF: 1.13,
  CRC: 0.0019, NIO: 0.027, AUD: 0.66, CAD: 0.74, JPY: 0.0067, THB: 0.028, MVR: 0.065
};
function toUSD(amount, ccy) {
  var rate = FX_TO_USD[ccy];
  if (rate === undefined) rate = 1;
  return amount * rate;
}
function formatStartingPrice(amount, ccy) {
  var usd = toUSD(amount, ccy);
  var floored = Math.floor(usd / 10) * 10;
  return '$' + floored.toLocaleString() + '+';
}
function momentPriceValue(s) {
  var pkgs = Array.isArray(s.packages) ? s.packages : [];
  var moment = null;
  for (var i = 0; i < pkgs.length; i++) {
    if (pkgs[i] && pkgs[i]['Tier Name'] === 'The Moment') { moment = pkgs[i]; break; }
  }
  var price = (moment && moment.Price != null && moment.Price !== '') ? moment.Price : null;
  if (price == null && s['Price Moment'] != null && s['Price Moment'] !== '') price = s['Price Moment'];
  return price;
}
function momentStartingPriceText(s) {
  var price = momentPriceValue(s);
  if (price == null) return '';
  return formatStartingPrice(Number(price), s['Price Currency']);
}

/* --------------------------------------------------------------
   6. Spot card — same markup as index.html buildSpotCard()
   -------------------------------------------------------------- */
function getCardImgs(s) {
  var main = optimizeAirtableImage(s['Spot Card Photo'] || s['Cover Photo'] || '');
  var gallery = (s['Gallery Photos'] || []).map(function (p) {
    if (typeof p === 'string') return optimizeAirtableImage(p);
    return optimizeAirtableImage((p && p.url) || '');
  }).filter(Boolean).slice(0, 3);
  return [main].concat(gallery).filter(Boolean);
}

function spotSlug(s) {
  return (s.Slug || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
    || (s.Name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
    || s.id || '';
}

function buildSpotCard(s, index) {
  var cardPhoto = optimizeAirtableImage(s['Spot Card Photo'] || s['Cover Photo']);
  var badge = s.badge ? '<span class="spot-card-badge">' + s.badge + '</span>' : '';
  var privacy = s.Privacy || '';
  var vibe = Array.isArray(s['Vibe']) ? s['Vibe'][0] : (s['Vibe'] || '');
  var imgs = getCardImgs(s);
  var hasMultiple = imgs.length > 1;
  var imgsAttr = hasMultiple ? "data-images='" + JSON.stringify(imgs) + "' data-index=\"0\"" : '';
  var lazyLoad = (index || 0) >= 3 ? ' loading="lazy"' : '';
  var pos = s['Card Position'] || 'center center';
  var slug = spotSlug(s);

  var scHtml = hasMultiple
    ? '<button class="sc-arrow sc-arrow-prev" onclick="event.stopPropagation();scPrev(this)">&#8249;</button>'
      + '<button class="sc-arrow sc-arrow-next" onclick="event.stopPropagation();scNext(this)">&#8250;</button>'
      + '<div class="sc-dots">'
      + imgs.map(function (_, i) { return '<div class="sc-dot' + (i === 0 ? ' active' : '') + '"></div>'; }).join('')
      + '</div>'
    : '';

  var stripHtml;
  if (hasMultiple) {
    stripHtml = '<div class="sc-strip">'
      + imgs.map(function (url, i) {
          var u400 = url.replace('width=800,', 'width=400,');
          var frameLazy = (i === 0) ? lazyLoad : ' loading="lazy"';
          return '<div class="sc-frame"><img class="img-bg" src="' + url.replace(/"/g, '&quot;')
            + '" srcset="' + u400.replace(/"/g, '&quot;') + ' 400w, ' + url.replace(/"/g, '&quot;') + ' 800w"'
            + ' sizes="(max-width: 600px) 400px, 800px" alt="" fetchpriority="low"' + frameLazy
            + ' style="object-fit:cover;width:100%;height:100%;object-position:' + pos + '"></div>';
        }).join('')
      + '<div class="sc-frame"><img class="img-bg" src="' + imgs[0].replace(/"/g, '&quot;')
      + '" srcset="' + imgs[0].replace('width=800,', 'width=400,').replace(/"/g, '&quot;') + ' 400w, '
      + imgs[0].replace(/"/g, '&quot;') + ' 800w" sizes="(max-width: 600px) 400px, 800px" alt=""'
      + ' fetchpriority="low" loading="lazy" style="object-fit:cover;width:100%;height:100%;object-position:' + pos + '"></div>'
      + '</div>';
  } else if (cardPhoto) {
    stripHtml = '<img class="img-bg" src="' + cardPhoto.replace(/"/g, '&quot;')
      + '" srcset="' + cardPhoto.replace('width=800,', 'width=400,').replace(/"/g, '&quot;') + ' 400w, '
      + cardPhoto.replace(/"/g, '&quot;') + ' 800w" sizes="(max-width: 600px) 400px, 800px" alt=""'
      + ' fetchpriority="low"' + lazyLoad + ' style="object-fit:cover;width:100%;height:100%;object-position:' + pos + '">';
  } else {
    stripHtml = '<div class="img-bg" style="background:' + (s.coverGradient || 'var(--bg3)') + '"></div>';
  }

  /* Only render strip segments that actually have a value. Plenty of spots
     have no Privacy or no Moment price, and rendering them anyway leaves
     stray dividers floating with nothing between them. */
  var stripParts = [privacy, momentStartingPriceText(s), vibe].filter(function (p) {
    return p && String(p).trim();
  });
  var bodyHtml = stripParts.map(function (p) {
    return '<div class="spot-card-strip-item"><span class="spot-card-strip-text">' + p + '</span></div>';
  }).join('<div class="spot-card-strip-divider"></div>');

  var locBits = [s.Region, s.Country].filter(function (p) { return p && String(p).trim(); });

  return ''
    + '<a class="spot-card" data-spot-id="' + s.id + '" href="/spots/' + slug + '" style="cursor:pointer">'
    +   '<div class="spot-card-img" ' + imgsAttr + '>'
    +     stripHtml + badge + scHtml
    +   '</div>'
    +   '<div class="spot-card-name">' + (s.Name || '') + '</div>'
    +   '<div class="spot-card-location">' + locBits.join(', ') + '</div>'
    +   '<div class="spot-card-body">' + bodyHtml + '</div>'
    + '</a>';
}

/* --------------------------------------------------------------
   7. Filtering
   -------------------------------------------------------------- */
function matchesVibe(s, vibe) {
  if (!vibe) return true;
  var v = vibe.toLowerCase();
  var pool = [];
  if (Array.isArray(s.Vibe)) pool = pool.concat(s.Vibe); else if (s.Vibe) pool.push(s.Vibe);
  pool = pool.concat(s['Vibe Secondary All'] || []).concat(s['Other Vibe'] || []);
  for (var i = 0; i < pool.length; i++) {
    if (String(pool[i]).toLowerCase().indexOf(v) > -1) return true;
  }
  return false;
}

/* "1 spots" reads as a bug to anyone who sees it. */
function spotCount(n) {
  return n + (n === 1 ? ' spot' : ' spots');
}

function matchesDestination(s, q) {
  if (!q) return true;
  var t = q.toLowerCase().trim();
  return (s.Name || '').toLowerCase().indexOf(t) > -1
    || (s.Region || '').toLowerCase().indexOf(t) > -1
    || (s.Country || '').toLowerCase().indexOf(t) > -1
    || continentOf(s).toLowerCase().indexOf(t) > -1;
}

/* Spots passing the filter bar + pills, ignoring the viewport */
function getFilteredSpots() {
  return allSpots.filter(function (s) {
    if (state.vibe && !matchesVibe(s, state.vibe)) return false;
    if (state.budget && s.Budget !== state.budget) return false;
    if (state.continent && continentOf(s) !== state.continent) return false;
    if (state.destination && !matchesDestination(s, state.destination)) return false;
    return true;
  });
}

/* Of those, the ones currently inside the map viewport */
function getVisibleSpots(filtered) {
  if (!state.searchAsMove || !map || !mapReady) return filtered;
  var b = map.getBounds();
  if (!b) return filtered;
  return filtered.filter(function (s) {
    return hasCoords(s) && b.contains([s.Longitude, s.Latitude]);
  });
}

/* --------------------------------------------------------------
   8. Rendering the results panel
   -------------------------------------------------------------- */
function renderResults() {
  var filtered = getFilteredSpots();
  var visible = getVisibleSpots(filtered);

  var grid = document.getElementById('map-grid');
  var head = document.getElementById('map-results-head');
  var countEl = document.getElementById('map-results-count');
  var noteEl = document.getElementById('map-results-note');
  var empty = document.getElementById('map-empty');
  var loading = document.getElementById('map-loading');

  if (loading) loading.style.display = 'none';
  head.style.display = 'flex';

  var n = visible.length;
  countEl.textContent = n === 0 ? 'No spots' : (n + (n === 1 ? ' spot' : ' spots'));

  var noCoords = filtered.filter(function (s) { return !hasCoords(s); }).length;
  var noteBits = [];
  if (state.searchAsMove && mapReady) noteBits.push('in this area');
  if (noCoords) noteBits.push(noCoords + ' not yet mapped');
  noteEl.textContent = noteBits.join(' · ');

  grid.innerHTML = visible.map(function (s, i) { return buildSpotCard(s, i); }).join('');
  empty.style.display = n === 0 ? 'block' : 'none';

  renderTray(visible);
  wireCardHovers();
  syncMarkers(filtered, visible);
}

function renderTray(visible) {
  var tray = document.getElementById('map-tray');
  if (!tray) return;
  tray.innerHTML = visible.map(function (s, i) { return buildSpotCard(s, i); }).join('');

  var label = document.getElementById('map-sheet-label');
  if (label) {
    var n = visible.length;
    /* Carries the qualifier too, since the list header is hidden on mobile.
       Same condition renderResults uses for its note. */
    var qualifier = (state.searchAsMove && mapReady) ? ' in this area' : '';
    label.textContent = n === 0
      ? 'No spots in view'
      : n + (n === 1 ? ' spot' : ' spots') + qualifier;
  }
}

/* Mirror the current filters into the collapsed mobile pill */
function syncCompactLabel() {
  var main = document.getElementById('msb-compact-main');
  var sub = document.getElementById('msb-compact-sub');
  if (!main || !sub) return;
  main.textContent = state.destination || 'Search destinations';
  var bits = [state.vibe || 'Any vibe', state.budget || 'Any budget'];
  if (state.continent) bits.push(state.continent);
  sub.textContent = bits.join(' · ');
}

function closeTray() {
  document.body.classList.remove('map-tray-open');
}

/* Hovering a card highlights its pin, and vice versa */
function wireCardHovers() {
  document.querySelectorAll('#map-grid .spot-card').forEach(function (card) {
    var id = card.getAttribute('data-spot-id');
    card.addEventListener('mouseenter', function () { setActiveSpot(id, true); });
    card.addEventListener('mouseleave', function () { setActiveSpot(id, false); });
  });
}

function setActiveSpot(id, on) {
  markers.forEach(function (m) {
    if (m.spot.id === id) m.el.classList.toggle('is-active', !!on);
  });
}

function setActiveCard(id, on) {
  document.querySelectorAll('#map-grid .spot-card[data-spot-id="' + id + '"]').forEach(function (c) {
    c.classList.toggle('is-hovered', !!on);
  });
}

/* --------------------------------------------------------------
   9. Map
   -------------------------------------------------------------- */
function initMap() {
  if (!MAPBOX_TOKEN || MAPBOX_TOKEN.indexOf('PASTE_') === 0) {
    var pane = document.getElementById('map');
    pane.innerHTML = '<div class="map-token-notice">'
      + '<strong>Map needs a Mapbox token</strong>'
      + '<span>Create a free token at mapbox.com, then set <code>MAPBOX_TOKEN</code> at the top of map.html.</span>'
      + '<span>The listings panel works without it.</span>'
      + '</div>';
    return;
  }

  /* mapbox-gl.js itself failed to load — offline, a content blocker, or the
     CDN being unreachable. The listings panel works fully without the map, so
     degrade gracefully instead of throwing and taking the whole page down. */
  if (typeof mapboxgl === 'undefined') {
    document.getElementById('map').innerHTML = '<div class="map-token-notice">'
      + '<strong>Map could not load</strong>'
      + '<span>Check your connection or any content blocker, then refresh.</span>'
      + '<span>Every listing is still shown in the panel.</span>'
      + '</div>';
    return;
  }

  mapboxgl.accessToken = MAPBOX_TOKEN;

  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [10, 30],
    zoom: 1.4,
    attributionControl: false,
    cooperativeGestures: false
  });

  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');
  map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');

  map.on('load', function () {
    applyBrandMapStyle();
    mapReady = true;
    buildMarkers();
    if (pendingFit) { fitToSpots(getFilteredSpots()); pendingFit = false; }
    renderResults();
  });

  /* Re-filter the list whenever the viewport settles */
  map.on('moveend', function () {
    if (!mapReady) return;
    if (state.searchAsMove) renderResults();
    else placeMarkers();
  });
  map.on('zoomend', function () { if (mapReady) placeMarkers(); });
}

/* Nudge the basemap toward our cream palette so it does not read
   as a generic Google/Mapbox map. Layer names vary between styles,
   so every write is guarded. */
function applyBrandMapStyle() {
  var tints = [
    ['land', 'background-color', '#EFEBE3'],
    ['background', 'background-color', '#EFEBE3'],
    ['water', 'fill-color', '#D9DEDB'],
    ['landuse', 'fill-color', '#E8E4DB'],
    ['national-park', 'fill-color', '#E2E4DA'],
    ['landcover', 'fill-color', '#E5E6DC']
  ];
  tints.forEach(function (t) {
    try {
      if (map.getLayer(t[0])) map.setPaintProperty(t[0], t[1], t[2]);
    } catch (e) { /* layer not in this style — fine */ }
  });
}

function fitToSpots(spots) {
  var pts = spots.filter(hasCoords);
  if (!map || !pts.length) return;
  if (pts.length === 1) {
    map.easeTo({ center: [pts[0].Longitude, pts[0].Latitude], zoom: 9, duration: 600 });
    return;
  }
  var b = new mapboxgl.LngLatBounds();
  pts.forEach(function (s) { b.extend([s.Longitude, s.Latitude]); });
  map.fitBounds(b, { padding: 70, maxZoom: 11, duration: 700 });
}

function buildMarkers() {
  markers.forEach(function (m) { m.marker.remove(); });
  markers = [];

  allSpots.filter(hasCoords).forEach(function (s) {
    var wrap = document.createElement('div');
    wrap.className = 'pin-wrap';

    var el = document.createElement('div');
    el.className = 'pin';
    var price = momentStartingPriceText(s);
    el.textContent = price || (s.Name || '').split(' ').slice(0, 2).join(' ');
    wrap.appendChild(el);

    el.addEventListener('mouseenter', function () { setActiveCard(s.id, true); });
    el.addEventListener('mouseleave', function () { setActiveCard(s.id, false); });
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      /* Mobile mirrors Airbnb: tapping a pin slides its card up over the map.
         Desktop shows the popup card on the map itself. */
      if (document.body.classList.contains('map-mode-map')) {
        document.body.classList.add('map-tray-open');
      } else {
        openSpotPopup(s);
      }
      scrollCardIntoView(s.id);
    });

    var marker = new mapboxgl.Marker({ element: wrap })
      .setLngLat([s.Longitude, s.Latitude])
      .addTo(map);

    markers.push({ spot: s, marker: marker, el: el, wrap: wrap });
  });
}

/* Show/hide markers to match the current filters, then cluster them */
function syncMarkers(filtered, visible) {
  if (!mapReady) return;
  var allowed = {};
  filtered.forEach(function (s) { allowed[s.id] = true; });
  markers.forEach(function (m) {
    m.allowed = !!allowed[m.spot.id];
  });
  placeMarkers();
}

/* --------------------------------------------------------------
   10. Clustering
   Greedy pixel-distance grouping. With ~50 spots this is cheap and
   avoids another dependency. It also gives us somewhere sensible to
   handle spots that share identical coordinates.
   -------------------------------------------------------------- */
var CLUSTER_RADIUS_PX = 46;

function placeMarkers() {
  if (!map || !mapReady) return;

  clusterMarkers.forEach(function (m) { m.remove(); });
  clusterMarkers = [];
  clearSpiderfy();

  var active = markers.filter(function (m) { return m.allowed !== false; });
  markers.forEach(function (m) { m.wrap.style.display = 'none'; });

  /* Project to screen space once */
  var pts = active.map(function (m) {
    var p = map.project([m.spot.Longitude, m.spot.Latitude]);
    return { m: m, x: p.x, y: p.y, used: false };
  });

  var groups = [];
  for (var i = 0; i < pts.length; i++) {
    if (pts[i].used) continue;
    var group = [pts[i]];
    pts[i].used = true;
    for (var j = i + 1; j < pts.length; j++) {
      if (pts[j].used) continue;
      var dx = pts[j].x - pts[i].x;
      var dy = pts[j].y - pts[i].y;
      if (Math.sqrt(dx * dx + dy * dy) < CLUSTER_RADIUS_PX) {
        group.push(pts[j]);
        pts[j].used = true;
      }
    }
    groups.push(group);
  }

  groups.forEach(function (group) {
    if (group.length === 1) {
      group[0].m.wrap.style.display = '';
      return;
    }

    /* Are they all at (essentially) the same coordinate? If so no amount
       of zooming separates them, so fan them out instead. */
    var identical = group.every(function (p) {
      return Math.abs(p.m.spot.Latitude - group[0].m.spot.Latitude) < 0.0004
        && Math.abs(p.m.spot.Longitude - group[0].m.spot.Longitude) < 0.0004;
    });

    if (identical && map.getZoom() >= 12) {
      spiderfy(group);
      return;
    }

    var sumLat = 0, sumLng = 0;
    group.forEach(function (p) { sumLat += p.m.spot.Latitude; sumLng += p.m.spot.Longitude; });

    var cwrap = document.createElement('div');
    cwrap.className = 'pin-wrap';
    var el = document.createElement('div');
    el.className = 'pin-cluster';
    el.textContent = group.length;
    cwrap.appendChild(el);
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      if (identical) {
        map.easeTo({ center: [sumLng / group.length, sumLat / group.length], zoom: 13.5, duration: 600 });
        return;
      }
      var b = new mapboxgl.LngLatBounds();
      group.forEach(function (p) { b.extend([p.m.spot.Longitude, p.m.spot.Latitude]); });
      map.fitBounds(b, { padding: 90, maxZoom: 15, duration: 600 });
    });

    var cm = new mapboxgl.Marker({ element: cwrap })
      .setLngLat([sumLng / group.length, sumLat / group.length])
      .addTo(map);
    clusterMarkers.push(cm);
  });
}

/* Fan co-located spots out so each one stays clickable.

   The ring is an ellipse rather than a circle. Pins are price pills — wide
   and short — and a circle drops odd-numbered pins side by side at the same
   height, where their labels collide. Six of our duplicate groups are
   exactly three spots, so that case has to be right.

   Pin sizes are measured from what actually rendered rather than assumed,
   then the ellipse grows until nothing overlaps. That keeps the fan tight
   for short prices and still separates an unusually wide label (a long
   spot name standing in for a missing price). */
function spiderfy(group) {
  var n = group.length;
  var GAP = 8;
  var w = 0, h = 0;

  group.forEach(function (p) {
    p.m.wrap.style.display = '';           /* must be visible to measure */
    w = Math.max(w, p.m.el.offsetWidth || 78);
    h = Math.max(h, p.m.el.offsetHeight || 26);
  });
  w += GAP;
  h += GAP;

  var rx = w / 2, ry = h / 2;
  for (var guard = 0; guard < 60 && ringOverlaps(n, rx, ry, w, h); guard++) {
    rx *= 1.12;
    ry *= 1.06;
  }

  group.forEach(function (p, i) {
    var angle = (2 * Math.PI * i) / n - Math.PI / 2;
    /* Offset the inner pin only — the wrapper carries Mapbox's positioning */
    p.m.el.style.transform = 'translate(' + (Math.cos(angle) * rx).toFixed(1) + 'px,'
      + (Math.sin(angle) * ry).toFixed(1) + 'px)';
    p.m.el.dataset.spiderfied = '1';
  });
}

/* Axis-aligned overlap test for n pins spaced round an ellipse. */
function ringOverlaps(n, rx, ry, w, h) {
  for (var i = 0; i < n; i++) {
    var ax = rx * Math.cos(2 * Math.PI * i / n - Math.PI / 2);
    var ay = ry * Math.sin(2 * Math.PI * i / n - Math.PI / 2);
    for (var j = i + 1; j < n; j++) {
      var bx = rx * Math.cos(2 * Math.PI * j / n - Math.PI / 2);
      var by = ry * Math.sin(2 * Math.PI * j / n - Math.PI / 2);
      if (Math.abs(ax - bx) < w && Math.abs(ay - by) < h) return true;
    }
  }
  return false;
}

/* Clear spiderfy offsets whenever we re-place markers */
function clearSpiderfy() {
  markers.forEach(function (m) {
    if (m.el.dataset.spiderfied) {
      m.el.style.transform = '';
      delete m.el.dataset.spiderfied;
    }
  });
}

function openSpotPopup(s) {
  if (activePopup) { activePopup.remove(); activePopup = null; }
  var img = optimizeAirtableImage(s['Spot Card Photo'] || s['Cover Photo'] || '');
  var html = ''
    + '<a class="map-popup-card" href="/spots/' + spotSlug(s) + '">'
    +   '<span class="map-popup-img" style="background-image:url(\'' + img + '\')"></span>'
    +   '<span class="map-popup-body">'
    +     '<span class="map-popup-name">' + (s.Name || '') + '</span>'
    +     '<span class="map-popup-loc">' + (s.Region || '') + ', ' + (s.Country || '') + '</span>'
    +     '<span class="map-popup-meta">' + [s.Privacy, momentStartingPriceText(s)].filter(Boolean).join(' · ') + '</span>'
    +   '</span>'
    + '</a>';

  activePopup = new mapboxgl.Popup({ offset: 18, closeButton: true, className: 'map-popup', maxWidth: '250px' })
    .setLngLat([s.Longitude, s.Latitude])
    .setHTML(html)
    .addTo(map);
}

function scrollCardIntoView(id) {
  var card = document.querySelector('#map-grid .spot-card[data-spot-id="' + id + '"]');
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });

  var tray = document.getElementById('map-tray');
  var trayCard = tray && tray.querySelector('.spot-card[data-spot-id="' + id + '"]');
  if (trayCard) trayCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

/* --------------------------------------------------------------
   11. Destination typeahead over our own inventory
   -------------------------------------------------------------- */
function buildDestIndex() {
  var countries = {}, regions = {};
  allSpots.forEach(function (s) {
    if (s.Country) countries[s.Country] = (countries[s.Country] || 0) + 1;
    if (s.Region) {
      var key = s.Region.replace(/\s+/g, ' ').trim();
      if (!regions[key]) regions[key] = { count: 0, country: s.Country };
      regions[key].count++;
    }
  });

  var out = [];
  Object.keys(countries).sort().forEach(function (c) {
    out.push({ type: 'Country', label: c, sub: continentOf({ Country: c }) + ' · ' + spotCount(countries[c]), q: c });
  });
  Object.keys(regions).sort().forEach(function (r) {
    out.push({ type: 'Region', label: r, sub: regions[r].country + ' · ' + spotCount(regions[r].count), q: r });
  });
  allSpots.forEach(function (s) {
    if (s.Name) out.push({ type: 'Spot', label: s.Name, sub: (s.Region || '') + ', ' + (s.Country || ''), q: s.Name, spot: s });
  });
  return out;
}

var destIndex = [];
var destHighlight = -1;

function renderDestDropdown(query) {
  var dd = document.getElementById('msb-dest-dd');
  var q = (query || '').toLowerCase().trim();

  var matches = destIndex.filter(function (d) {
    return !q || d.label.toLowerCase().indexOf(q) > -1;
  });

  /* Rank whole-word / prefix matches first, like Airbnb does */
  if (q) {
    matches.sort(function (a, b) {
      var ap = a.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      var bp = b.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      if (ap !== bp) return ap - bp;
      return a.label.length - b.label.length;
    });
  }

  matches = matches.slice(0, 24);

  if (!matches.length) {
    dd.innerHTML = '<div class="msb-dd-empty">No destinations match &ldquo;' + escapeHtml(query) + '&rdquo;</div>';
    return;
  }

  var html = '';
  var lastType = '';
  matches.forEach(function (d, i) {
    if (d.type !== lastType) {
      html += '<div class="msb-dd-group">' + (d.type === 'Spot' ? 'Spots' : d.type === 'Region' ? 'Regions' : 'Countries') + '</div>';
      lastType = d.type;
    }
    html += '<div class="msb-dd-item" data-idx="' + i + '" data-q="' + escapeHtml(d.q) + '">'
      + escapeHtml(d.label)
      + '<span class="msb-dd-sub">' + escapeHtml(d.sub || '') + '</span>'
      + '</div>';
  });
  dd.innerHTML = html;

  dd.querySelectorAll('.msb-dd-item').forEach(function (item) {
    item.addEventListener('mousedown', function (e) {
      e.preventDefault();
      pickDestination(item.getAttribute('data-q'));
    });
  });
  destHighlight = -1;
}

function escapeHtml(str) {
  return String(str === undefined || str === null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function pickDestination(q) {
  state.destination = q || '';
  var input = document.getElementById('msb-dest-input');
  if (input) input.value = state.destination;
  closeAllDropdowns();
  applyFilters(true);
}

/* --------------------------------------------------------------
   12. Filter bar wiring
   -------------------------------------------------------------- */
function closeAllDropdowns() {
  document.querySelectorAll('.msb-segment').forEach(function (seg) { seg.classList.remove('open'); });
}

function buildVibeDropdown() {
  var dd = document.getElementById('msb-vibe-dd');
  var html = '<div class="msb-dd-item" data-val="">Any Vibe</div>';
  buildVibeList().forEach(function (v) {
    html += '<div class="msb-dd-item" data-val="' + v + '">' + v + '</div>';
  });
  dd.innerHTML = html;
  dd.querySelectorAll('.msb-dd-item').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.stopPropagation();
      var val = item.getAttribute('data-val');
      state.vibe = val;
      var el = document.getElementById('msb-vibe-val');
      el.textContent = val || 'Any Vibe';
      el.classList.toggle('placeholder', !val);
      closeAllDropdowns();
      applyFilters(true);
    });
  });
}

function buildBudgetDropdown() {
  var dd = document.getElementById('msb-budget-dd');
  var html = '<div class="msb-dd-item" data-val="">Any Budget</div>';
  BUDGETS.forEach(function (b) {
    html += '<div class="msb-dd-item" data-val="' + b.value + '">' + b.label + '</div>';
  });
  dd.innerHTML = html;
  dd.querySelectorAll('.msb-dd-item').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.stopPropagation();
      var val = item.getAttribute('data-val');
      state.budget = val;
      var label = 'Any Budget';
      BUDGETS.forEach(function (b) { if (b.value === val) label = b.label; });
      var el = document.getElementById('msb-budget-val');
      el.textContent = label;
      el.classList.toggle('placeholder', !val);
      closeAllDropdowns();
      applyFilters(true);
    });
  });
}

function buildContinentPills() {
  var row = document.getElementById('map-pills-row');
  var counts = {};
  allSpots.forEach(function (s) {
    var c = continentOf(s);
    if (c) counts[c] = (counts[c] || 0) + 1;
  });

  var present = CONTINENT_ORDER.filter(function (c) { return counts[c]; });

  var html = '<button class="map-pill' + (state.continent ? '' : ' active') + '" data-cont="">All</button>';
  present.forEach(function (c) {
    html += '<button class="map-pill' + (state.continent === c ? ' active' : '') + '" data-cont="' + c + '">' + c + '</button>';
  });
  row.innerHTML = html;

  row.querySelectorAll('.map-pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      state.continent = pill.getAttribute('data-cont');
      row.querySelectorAll('.map-pill').forEach(function (p) {
        p.classList.toggle('active', p === pill);
      });
      applyFilters(true);
    });
  });
}

/* Re-run filters; optionally refit the map to the new result set */
function applyFilters(refit) {
  syncUrl();
  syncCompactLabel();
  if (refit && mapReady) {
    var filtered = getFilteredSpots();
    if (filtered.filter(hasCoords).length) {
      /* Refit without triggering a bounds-filtered render mid-flight */
      var wasMove = state.searchAsMove;
      state.searchAsMove = false;
      fitToSpots(filtered);
      state.searchAsMove = wasMove;
      map.once('moveend', function () { renderResults(); });
    }
  }
  renderResults();
}

function syncUrl() {
  var p = new URLSearchParams();
  if (state.destination) p.set('destination', state.destination);
  if (state.vibe) p.set('vibe', state.vibe);
  if (state.budget) p.set('budget', state.budget);
  if (state.continent) p.set('continent', state.continent);
  var qs = p.toString();
  history.replaceState(null, '', '/map' + (qs ? '?' + qs : ''));
}

function readUrl() {
  var p = new URLSearchParams(window.location.search);

  var dest = p.get('destination') || '';
  if (dest) {
    /* Homepage links use slugs (south-of-france); turn those back into text */
    state.destination = dest.indexOf('-') > -1 && dest === dest.toLowerCase()
      ? dest.replace(/-/g, ' ')
      : dest;
    var input = document.getElementById('msb-dest-input');
    if (input) input.value = state.destination;
  }

  var vibe = p.get('vibe') || '';
  if (vibe) {
    state.vibe = vibe.charAt(0).toUpperCase() + vibe.slice(1).toLowerCase();
    var vEl = document.getElementById('msb-vibe-val');
    vEl.textContent = state.vibe;
    vEl.classList.remove('placeholder');
  }

  var budget = p.get('budget') || '';
  if (budget) {
    BUDGETS.forEach(function (b) {
      if (b.slug === budget.toLowerCase() || b.value.toLowerCase() === budget.toLowerCase()) {
        state.budget = b.value;
        var bEl = document.getElementById('msb-budget-val');
        bEl.textContent = b.label;
        bEl.classList.remove('placeholder');
      }
    });
  }

  var cont = p.get('continent') || '';
  if (cont) state.continent = cont;
}

/* Measure the real top-bar height instead of hardcoding it, so the split
   view and the mobile full-screen map always line up under it. */
function syncTopbarHeight() {
  var tb = document.querySelector('.map-topbar');
  if (!tb) return;
  document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}

/* --------------------------------------------------------------
   13. Mobile list <-> map
   -------------------------------------------------------------- */
/* The sheet tracks the finger rather than toggling, so the map behind it
   stays live and coming back down is immediate — the way Airbnb's does. */
var PEEK_PX = 88;      /* fallback until the grab bar has been measured */
var sheetY = 0;        /* current translateY, px */
var sheetMax = 0;      /* translateY when lowered to the peek */
var drag = null;
var dragMoved = false;

function isMobileView() { return window.innerWidth <= 1024; }

function measureSheet() {
  var el = document.getElementById('map-sheet');
  if (!el) return;
  /* Show exactly the grab bar when lowered. Measuring it beats a constant:
     a slice of the list peeking under the handle repeats the count that the
     handle is already showing. */
  var grab = document.getElementById('map-sheet-grab');
  var peek = grab && grab.offsetHeight ? grab.offsetHeight : PEEK_PX;
  sheetMax = Math.max(0, el.offsetHeight - peek);
}

function setSheetY(y, snapping) {
  var el = document.getElementById('map-sheet');
  if (!el) return;
  sheetY = Math.min(sheetMax, Math.max(0, y));
  el.classList.toggle('is-snapping', !!snapping);
  el.style.setProperty('--sheet-y', sheetY + 'px');

  var lowered = sheetMax > 0 && sheetY > sheetMax * 0.5;
  document.body.classList.toggle('map-mode-map', lowered);
  var label = document.getElementById('map-mobile-toggle-text');
  if (label) label.textContent = lowered ? 'List' : 'Map';
}

function snapSheet(where) {
  measureSheet();
  if (where === 'peek') {
    setSheetY(sheetMax, true);
    if (map) setTimeout(function () { map.resize(); }, 60);
  } else {
    setSheetY(0, true);
    closeTray();
  }
}

/* Kept so existing callers keep working; the sheet position is now the mode. */
function setMobileMode(toMap) { snapSheet(toMap ? 'peek' : 'full'); }

function wireMobileToggle() {
  var btn = document.getElementById('map-mobile-toggle');
  btn.addEventListener('click', function () {
    snapSheet(document.body.classList.contains('map-mode-map') ? 'full' : 'peek');
  });

  var grab = document.getElementById('map-sheet-grab');
  var list = document.getElementById('map-results');
  if (!grab || !list) return;

  /* Release velocity is measured over a short trailing window rather than
     the gap between the last two events. Touch events can arrive several to
     the millisecond, which makes a single-pair delta read as zero and loses
     the flick. */
  var VELOCITY_WINDOW_MS = 80;

  function start(y) {
    measureSheet();
    drag = { y: y, base: sheetY, samples: [{ y: y, t: Date.now() }] };
    dragMoved = false;
    var el = document.getElementById('map-sheet');
    if (el) el.classList.remove('is-snapping');
  }
  function move(y) {
    if (!drag) return;
    var now = Date.now();
    drag.samples.push({ y: y, t: now });
    while (drag.samples.length > 2 && now - drag.samples[0].t > VELOCITY_WINDOW_MS) {
      drag.samples.shift();
    }
    if (Math.abs(y - drag.y) > 4) dragMoved = true;
    setSheetY(drag.base + (y - drag.y), false);
  }
  function releaseVelocity() {
    var s = drag.samples;
    if (s.length < 2) return 0;
    var dt = s[s.length - 1].t - s[0].t;
    if (dt <= 0) return 0;                      /* too fast to measure */
    return (s[s.length - 1].y - s[0].y) / dt;   /* px per ms, + is downward */
  }
  function end() {
    if (!drag) return;
    var v = releaseVelocity();
    drag = null;
    if (!dragMoved) return;
    /* A decisive flick beats position, the way native sheets behave. */
    if (Math.abs(v) > 0.45) snapSheet(v > 0 ? 'peek' : 'full');
    else snapSheet(sheetY > sheetMax * 0.5 ? 'peek' : 'full');
  }

  grab.addEventListener('touchstart', function (e) { start(e.touches[0].clientY); }, { passive: true });
  grab.addEventListener('touchmove', function (e) { move(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  grab.addEventListener('touchend', end);
  grab.addEventListener('touchcancel', end);

  /* Tap the grab bar too, for anyone who doesn't think to drag it. */
  grab.addEventListener('click', function () {
    if (!dragMoved) snapSheet(document.body.classList.contains('map-mode-map') ? 'full' : 'peek');
  });

  /* Dragging down from the top of the list lowers the sheet; once it is
     back up, the same gesture returns to scrolling the list. */
  list.addEventListener('touchstart', function (e) {
    if (list.scrollTop <= 0) start(e.touches[0].clientY);
  }, { passive: true });
  list.addEventListener('touchmove', function (e) {
    if (!drag) return;
    var y = e.touches[0].clientY;
    if (y < drag.y && sheetY <= 0) { drag = null; return; }   /* let it scroll */
    move(y);
    e.preventDefault();
  }, { passive: false });
  list.addEventListener('touchend', end);
  list.addEventListener('touchcancel', end);

  measureSheet();
  setSheetY(0, false);
  window.addEventListener('resize', function () {
    if (!isMobileView()) return;
    var lowered = document.body.classList.contains('map-mode-map');
    measureSheet();
    setSheetY(lowered ? sheetMax : 0, false);
  });
}

/* --------------------------------------------------------------
   13b. Mobile filter sheet
   One section open at a time, the rest collapsed to a label/value
   row — the same shape as Airbnb's search sheet.
   -------------------------------------------------------------- */
var FSECTIONS = [
  { key: 'dest',   label: 'Destination', title: 'Where to?' },
  { key: 'vibe',   label: 'Vibe',        title: 'What&rsquo;s the vibe?' },
  { key: 'budget', label: 'Budget',      title: 'What&rsquo;s the budget?' }
];
var fOpen = 'dest';

function fValue(key) {
  if (key === 'dest') return state.destination || 'Anywhere';
  if (key === 'vibe') return state.vibe || 'Any Vibe';
  var out = 'Any Budget';
  BUDGETS.forEach(function (b) { if (b.value === state.budget) out = b.label; });
  return out;
}

function openFilterSheet() {
  fOpen = 'dest';
  renderFilterSheet();
  document.body.classList.add('fsheet-open');
  bindViewportSync();
}

function closeFilterSheet() {
  document.body.classList.remove('fsheet-open');
  unbindViewportSync();
  var el = document.getElementById('fsheet');
  if (el) {
    el.classList.remove('is-dragging', 'is-closing');
    el.style.transform = '';
  }
}

/* iOS keeps position:fixed pinned to the layout viewport, so an open keyboard
   hides the footer — and with it the Search button, which is the whole point
   of typing. Tracking visualViewport keeps the footer just above the keyboard. */
function syncSheetToViewport() {
  var vv = window.visualViewport;
  var el = document.getElementById('fsheet');
  if (!vv || !el) return;
  el.style.height = vv.height + 'px';
  el.style.top = vv.offsetTop + 'px';
}

function bindViewportSync() {
  if (!window.visualViewport) return;
  window.visualViewport.addEventListener('resize', syncSheetToViewport);
  window.visualViewport.addEventListener('scroll', syncSheetToViewport);
  syncSheetToViewport();
}

function unbindViewportSync() {
  var el = document.getElementById('fsheet');
  if (el) { el.style.height = ''; el.style.top = ''; }
  if (!window.visualViewport) return;
  window.visualViewport.removeEventListener('resize', syncSheetToViewport);
  window.visualViewport.removeEventListener('scroll', syncSheetToViewport);
}

/* Applies whatever the sheet currently holds and closes it. Shared by the
   Search button and the keyboard's search key. */
function runFilterSearch() {
  /* Push the sheet's choices back onto the desktop bar so the two views
     never disagree if the window is later widened. */
  var di = document.getElementById('msb-dest-input');
  if (di) di.value = state.destination;
  var vv = document.getElementById('msb-vibe-val');
  if (vv) {
    vv.textContent = state.vibe || 'Any Vibe';
    vv.classList.toggle('placeholder', !state.vibe);
  }
  var bv = document.getElementById('msb-budget-val');
  if (bv) {
    var lbl = 'Any Budget';
    BUDGETS.forEach(function (b) { if (b.value === state.budget) lbl = b.label; });
    bv.textContent = lbl;
    bv.classList.toggle('placeholder', !state.budget);
  }
  closeFilterSheet();
  applyFilters(true);
}

function wireFilterSheet() {
  var close = document.getElementById('fsheet-close');
  var reset = document.getElementById('fsheet-reset');
  var search = document.getElementById('fsheet-search');
  var head = document.getElementById('fsheet-head');
  var el = document.getElementById('fsheet');

  if (close) close.addEventListener('click', closeFilterSheet);
  if (search) search.addEventListener('click', runFilterSearch);

  if (reset) reset.addEventListener('click', function () {
    state.destination = '';
    state.vibe = '';
    state.budget = '';
    state.continent = '';
    buildContinentPills();
    renderFilterSheet();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('fsheet-open')) {
      closeFilterSheet();
    }
  });

  /* Swipe the header down to dismiss, so the X is never the only way out. */
  if (head && el) {
    var from = null;
    head.addEventListener('touchstart', function (e) {
      from = e.touches[0].clientY;
      el.classList.add('is-dragging');
    }, { passive: true });

    head.addEventListener('touchmove', function (e) {
      if (from === null) return;
      var dy = e.touches[0].clientY - from;
      if (dy <= 0) return;                 /* only downward closes */
      el.style.transform = 'translateY(' + dy + 'px)';
      e.preventDefault();
    }, { passive: false });

    function release(e) {
      if (from === null) return;
      var y = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : from;
      var dy = y - from;
      from = null;
      el.classList.remove('is-dragging');
      if (dy > 90) {
        el.classList.add('is-closing');
        el.style.transform = 'translateY(100%)';
        setTimeout(closeFilterSheet, 200);
      } else {
        el.style.transform = '';
      }
    }
    head.addEventListener('touchend', release);
    head.addEventListener('touchcancel', release);
  }
}

function fItem(val, label, on) {
  return '<button class="fp-item' + (on ? ' is-on' : '') + '" data-val="' + escapeHtml(val) + '" type="button">'
    + '<span>' + label + '</span>'
    + (on ? '<span class="fp-item-sub">Selected</span>' : '')
    + '</button>';
}

function renderFilterSheet() {
  var body = document.getElementById('fsheet-body');
  if (!body) return;
  var html = '';

  FSECTIONS.forEach(function (sec) {
    if (sec.key !== fOpen) {
      html += '<button class="fpanel fpanel-collapsed" data-sec="' + sec.key + '" type="button">'
        + '<span class="fp-label">' + sec.label + '</span>'
        + '<span class="fp-value">' + escapeHtml(fValue(sec.key)) + '</span>'
        + '</button>';
      return;
    }

    html += '<div class="fpanel fpanel-open"><h3 class="fp-title">' + sec.title + '</h3>';

    if (sec.key === 'dest') {
      html += '<div class="fp-search">'
        + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">'
        + '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>'
        + '<input type="search" id="fsheet-dest" placeholder="Search destinations" '
        + 'value="' + escapeHtml(state.destination) + '" autocomplete="off" spellcheck="false" '
        + 'enterkeyhint="search" inputmode="search">'
        + '</div>'
        + '<div class="fp-list" id="fsheet-dest-list"></div>';
    } else if (sec.key === 'vibe') {
      html += '<div class="fp-opts">' + fItem('', 'Any Vibe', !state.vibe);
      buildVibeList().forEach(function (v) { html += fItem(v, escapeHtml(v), state.vibe === v); });
      html += '</div>';
    } else {
      html += '<div class="fp-opts">' + fItem('', 'Any Budget', !state.budget);
      BUDGETS.forEach(function (b) { html += fItem(b.value, escapeHtml(b.label), state.budget === b.value); });
      html += '</div>';
    }
    html += '</div>';
  });

  body.innerHTML = html;
  wireFilterPanels();
  if (fOpen === 'dest') renderFsheetDest(state.destination || '');
}

function renderFsheetDest(q) {
  var list = document.getElementById('fsheet-dest-list');
  if (!list) return;
  var needle = (q || '').toLowerCase().trim();

  var matches = destIndex.filter(function (d) {
    return !needle || d.label.toLowerCase().indexOf(needle) > -1;
  });
  if (needle) {
    matches.sort(function (a, b) {
      var ap = a.label.toLowerCase().indexOf(needle) === 0 ? 0 : 1;
      var bp = b.label.toLowerCase().indexOf(needle) === 0 ? 0 : 1;
      if (ap !== bp) return ap - bp;
      return a.label.length - b.label.length;
    });
  }
  matches = matches.slice(0, 30);

  if (!matches.length) {
    list.innerHTML = '<div class="fp-empty">No destinations match &ldquo;' + escapeHtml(q) + '&rdquo;</div>';
    return;
  }

  var html = '';
  var lastType = '';
  matches.forEach(function (d) {
    if (d.type !== lastType) {
      html += '<div class="fp-group">'
        + (d.type === 'Spot' ? 'Spots' : d.type === 'Region' ? 'Regions' : 'Countries')
        + '</div>';
      lastType = d.type;
    }
    html += '<button class="fp-item" data-q="' + escapeHtml(d.q) + '" type="button">'
      + '<span>' + escapeHtml(d.label) + '</span>'
      + '<span class="fp-item-sub">' + escapeHtml(d.sub || '') + '</span>'
      + '</button>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.fp-item').forEach(function (item) {
    item.addEventListener('click', function () {
      /* Deliberately stays on this section. Every filter here is optional, so
         someone after just "Sorrento" should be one tap from Search rather
         than pushed through vibe and budget first. */
      state.destination = item.getAttribute('data-q') || '';
      renderFilterSheet();
    });
  });
}

function wireFilterPanels() {
  var body = document.getElementById('fsheet-body');

  body.querySelectorAll('.fpanel-collapsed').forEach(function (btn) {
    btn.addEventListener('click', function () {
      fOpen = btn.getAttribute('data-sec');
      renderFilterSheet();
    });
  });

  var input = document.getElementById('fsheet-dest');
  if (input) {
    input.addEventListener('input', function () {
      state.destination = input.value;
      renderFsheetDest(input.value);
    });
    /* The typed text is the query — no suggestion has to be picked. iOS shows
       a search key for enterkeyhint="search"; honour it, since the footer can
       sit behind the keyboard. */
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        input.blur();
        runFilterSearch();
      }
    });
  }

  if (fOpen === 'vibe' || fOpen === 'budget') {
    body.querySelectorAll('.fpanel-open .fp-item').forEach(function (item) {
      item.addEventListener('click', function () {
        var val = item.getAttribute('data-val') || '';
        if (fOpen === 'vibe') state.vibe = val;
        else state.budget = val;
        renderFilterSheet();   /* stays open; Search is always one tap away */
      });
    });
  }
}



/* --------------------------------------------------------------
   14. Boot
   -------------------------------------------------------------- */
function wireChrome() {
  /* Segment open/close */
  document.getElementById('msb-vibe-seg').addEventListener('click', function (e) {
    if (e.target.closest('.msb-dropdown')) return;
    var open = this.classList.contains('open');
    closeAllDropdowns();
    this.classList.toggle('open', !open);
  });
  document.getElementById('msb-budget-seg').addEventListener('click', function (e) {
    if (e.target.closest('.msb-dropdown')) return;
    var open = this.classList.contains('open');
    closeAllDropdowns();
    this.classList.toggle('open', !open);
  });

  var input = document.getElementById('msb-dest-input');
  input.addEventListener('focus', function () {
    closeAllDropdowns();
    document.getElementById('msb-dest-seg').classList.add('open');
    renderDestDropdown(input.value);
  });
  input.addEventListener('input', function () {
    document.getElementById('msb-dest-seg').classList.add('open');
    renderDestDropdown(input.value);
  });
  input.addEventListener('keydown', function (e) {
    var items = document.querySelectorAll('#msb-dest-dd .msb-dd-item');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      destHighlight += (e.key === 'ArrowDown' ? 1 : -1);
      if (destHighlight < 0) destHighlight = items.length - 1;
      if (destHighlight >= items.length) destHighlight = 0;
      items.forEach(function (it, i) { it.classList.toggle('active', i === destHighlight); });
      items[destHighlight].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      /* Enter takes the highlighted row, else the first suggestion, else the
         raw text — so typing "ital" and hitting Enter resolves to Italy. */
      if (destHighlight > -1 && items[destHighlight]) {
        pickDestination(items[destHighlight].getAttribute('data-q'));
      } else if (items.length) {
        pickDestination(items[0].getAttribute('data-q'));
      } else {
        pickDestination(input.value);
      }
    } else if (e.key === 'Escape') {
      closeAllDropdowns();
    }
  });

  document.getElementById('msb-btn').addEventListener('click', function () {
    pickDestination(document.getElementById('msb-dest-input').value);
  });

  document.addEventListener('mousedown', function (e) {
    if (!e.target.closest('#msb-wrap')) closeAllDropdowns();
  });

  /* Compact mobile pill opens the full-screen filter sheet */
  document.getElementById('msb-compact').addEventListener('click', openFilterSheet);

  /* Tapping the map dismisses the pin card */
  var mapEl = document.getElementById('map');
  if (mapEl) mapEl.addEventListener('click', function () { closeTray(); });

  document.getElementById('map-move-check').addEventListener('change', function () {
    state.searchAsMove = this.checked;
    renderResults();
  });

  document.getElementById('map-reset').addEventListener('click', function () {
    state.destination = ''; state.vibe = ''; state.budget = ''; state.continent = '';
    document.getElementById('msb-dest-input').value = '';
    var vEl = document.getElementById('msb-vibe-val');
    vEl.textContent = 'Any Vibe'; vEl.classList.add('placeholder');
    var bEl = document.getElementById('msb-budget-val');
    bEl.textContent = 'Any Budget'; bEl.classList.add('placeholder');
    buildContinentPills();
    applyFilters(true);
  });

  window.addEventListener('resize', function () {
    syncTopbarHeight();
    if (map) map.resize();
  });
}

(async function boot() {
  wireChrome();
  wireMobileToggle();
  wireFilterSheet();
  readUrl();

  allSpots = await fetchSpots();
  destIndex = buildDestIndex();
  buildVibeDropdown();
  buildBudgetDropdown();
  buildContinentPills();
  syncCompactLabel();
  syncTopbarHeight();

  var mapped = allSpots.filter(hasCoords).length;
  console.log('Loaded ' + allSpots.length + ' spots, ' + mapped + ' with coordinates.');

  initMap();
  renderResults();
})();
